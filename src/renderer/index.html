<!doctype html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <style>
      .app-boot-fallback {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 8px;
        padding: 32px;
        color: #f2f0f2;
        background: #111014;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }

      .app-boot-fallback strong {
        font-size: 18px;
        font-weight: 650;
      }

      .app-boot-fallback span {
        color: #a6a1aa;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="app-boot-fallback" role="status" aria-live="polite">
        <strong>企鹅相册</strong>
        <span>正在启动…</span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
