name: Promote verified release to R2

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 操作类型：正常发布、回退到历史快照、覆盖当前同版本
        required: true
        default: promote
        type: choice
        options:
          - promote
          - rollback
          - replace
      tag:
        description: 指定已发布标签（正常发布可留空；回退和覆盖必须填写）
        required: false
        default: ''
        type: string
      cache_purge:
        description: 同版本覆盖后的 CDN 清理方式（令牌无 Cache Purge 权限时选择 manual）
        required: true
        default: automatic
        type: choice
        options:
          - automatic
          - manual

permissions:
  contents: read

concurrency:
  group: promote-r2
  cancel-in-progress: false

jobs:
  promote-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      RELEASE_TAG: ${{ inputs.tag }}
      PROMOTION_OPERATION: ${{ inputs.operation }}
      CACHE_PURGE_MODE: ${{ inputs.cache_purge }}
      R2_VERSIONED_REPLACEMENT: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: 11273/QzonePhoto
    steps:
      - name: Validate R2 promotion configuration
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "Missing secret: R2_ACCESS_KEY_ID"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY:-}" || { echo "Missing secret: R2_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${R2_BUCKET:-}" || { echo "Missing repository variable: R2_BUCKET"; exit 1; }
          test -n "${R2_ENDPOINT:-}" || { echo "Missing repository variable: R2_ENDPOINT"; exit 1; }
          test "${R2_PUBLIC_BASE_URL:-}" = "https://dl.qzonephoto.getgit.one" || {
            echo "R2_PUBLIC_BASE_URL must be https://dl.qzonephoto.getgit.one"
            exit 1
          }

      - name: Resolve release to promote
        run: |
          set -euo pipefail
          case "${PROMOTION_OPERATION}" in
            promote|rollback|replace) ;;
            *) echo "Unsupported R2 operation: ${PROMOTION_OPERATION}"; exit 1 ;;
          esac
          case "${CACHE_PURGE_MODE}" in
            automatic|manual) ;;
            *) echo "Unsupported cache purge mode: ${CACHE_PURGE_MODE}"; exit 1 ;;
          esac
          if [ "${PROMOTION_OPERATION}" != 'promote' ] && [ -z "${RELEASE_TAG}" ]; then
            echo "${PROMOTION_OPERATION} requires an explicit stable tag"
            exit 1
          fi
          if [ -z "${RELEASE_TAG}" ]; then
            RELEASE_TAG="$(gh release list --repo "${GH_REPO}" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
            test -n "${RELEASE_TAG}" || {
              echo 'No published stable GitHub Release is available to promote'
              exit 1
            }
            echo "Automatically selected latest published release: ${RELEASE_TAG}"
          else
            echo "Manually selected release: ${RELEASE_TAG}"
          fi
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only stable tags such as v2.6.1 can enter the R2 stable channel"
            exit 1
          }
          draft="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json isDraft --jq '.isDraft')"
          prerelease="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json isPrerelease --jq '.isPrerelease')"
          published_at="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json publishedAt --jq '.publishedAt')"
          test "${draft}" = 'false' || { echo "Release ${RELEASE_TAG} must be public before R2 promotion"; exit 1; }
          test "${prerelease}" = 'false' || { echo "Release ${RELEASE_TAG} must not be a prerelease"; exit 1; }
          node -e 'const value = process.argv[1]; if (Number.isNaN(Date.parse(value))) process.exit(1)' "${published_at}" || {
            echo "Release ${RELEASE_TAG} has an invalid publishedAt timestamp"
            exit 1
          }
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "${GITHUB_ENV}"
          echo "RELEASE_PUBLISHED_AT=${published_at}" >> "${GITHUB_ENV}"
          {
            echo '### R2 release selected'
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Operation: \`${PROMOTION_OPERATION}\`"
            echo "- Cache purge: \`${CACHE_PURGE_MODE}\`"
            echo '- Source: published stable GitHub Release'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out release scripts from main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify release promotion logic
        run: pnpm test:release

      - name: Download matching public release assets
        if: env.PROMOTION_OPERATION != 'rollback'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" --repo "${GH_REPO}" --dir artifacts \
            --pattern '*.exe' --pattern '*.zip' --pattern '*.dmg' \
            --pattern '*.AppImage' --pattern '*.deb' --pattern 'latest*.yml' \
            --pattern '*.blockmap'
          test -n "$(find artifacts -type f -name 'latest*.yml' -print -quit)" || {
            echo "Release is missing updater metadata"
            exit 1
          }

      - name: Verify release and prepare its public manifest
        if: env.PROMOTION_OPERATION != 'rollback'
        run: |
          set -euo pipefail
          node scripts/verify-release-assets.mjs \
            --assets=artifacts --version="${RELEASE_VERSION}" \
            --fileList=verified-release-files.txt
          mkdir verified-assets
          while IFS= read -r name; do
            cp "artifacts/${name}" "verified-assets/${name}"
          done < verified-release-files.txt
          node scripts/rebase-update-metadata.mjs \
            --assets=artifacts --out=stable-update-metadata --releasePath="${RELEASE_TAG}" \
            --fileList=verified-release-files.txt
          manifest_key="manifests/${RELEASE_TAG}.json"
          candidate_manifest='candidate-release-manifest.json'
          node scripts/generate-release-manifest.mjs \
            --artifacts=verified-assets --out="${candidate_manifest}" --tag="${RELEASE_TAG}" \
            --releasePath="${RELEASE_TAG}" --publicBaseUrl="${R2_PUBLIC_BASE_URL}" \
            --githubRepo="${GH_REPO}" --generatedAt="${RELEASE_PUBLISHED_AT}"
          current_stable_tag=''
          if aws s3api head-object --bucket "${R2_BUCKET}" --key 'manifests/latest.json' \
            --endpoint-url "${R2_ENDPOINT}" >/dev/null 2>&1; then
            aws s3 cp "s3://${R2_BUCKET}/manifests/latest.json" current-stable-manifest.json \
              --endpoint-url "${R2_ENDPOINT}" --only-show-errors
            current_stable_tag="$(node -e 'const value=require("./current-stable-manifest.json"); process.stdout.write(String(value.tag || ""))')"
            [[ "${current_stable_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo 'Existing stable R2 manifest has an invalid tag; refusing to replace versioned files.'
              exit 1
            }
          fi
          enable_versioned_replacement() {
            local reason="$1"
            echo 'R2_VERSIONED_REPLACEMENT=true' >> "${GITHUB_ENV}"
            {
              echo '### Replacing an R2 release copy'
              echo
              echo "- Release: \`${RELEASE_TAG}\`"
              echo "- Current stable R2 release: \`${current_stable_tag:-none}\`"
              echo "- Reason: ${reason}"
              if [ "${PROMOTION_OPERATION}" = 'replace' ]; then
                echo '- Safety: all changed versioned objects are backed up, restored on failure, and purged from CDN cache after either outcome.'
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          }
          if [ "${PROMOTION_OPERATION}" = 'replace' ] && [ "${current_stable_tag}" != "${RELEASE_TAG}" ]; then
            echo "Replacement is allowed only for the current stable R2 tag (${current_stable_tag:-none})."
            exit 1
          fi
          versioned_object_count="$(aws s3api list-objects-v2 --bucket "${R2_BUCKET}" \
            --prefix "releases/${RELEASE_TAG}/" --max-keys 1 --endpoint-url "${R2_ENDPOINT}" \
            --query 'KeyCount' --output text)"
          existing_versioned_manifest=false
          if aws s3api head-object --bucket "${R2_BUCKET}" --key "${manifest_key}" \
            --endpoint-url "${R2_ENDPOINT}" >/dev/null 2>&1; then
            existing_versioned_manifest=true
          fi
          if [ "${current_stable_tag}" != "${RELEASE_TAG}" ] && \
            { [ "${versioned_object_count}" != '0' ] || [ "${existing_versioned_manifest}" = true ]; }; then
            # The selected tag is not live. Any old objects are only a failed attempt or an
            # earlier verification build, so rebuild the complete release rather than letting a
            # stale manifest, metadata file, blockmap, or installer fail one-by-one later.
            mv "${candidate_manifest}" "artifacts/${RELEASE_TAG}.json"
            echo "Found an inactive R2 copy of ${RELEASE_TAG}; rebuilding it from verified GitHub assets."
            enable_versioned_replacement 'inactive copy is incomplete or superseded'
          elif [ "${existing_versioned_manifest}" = true ]; then
            aws s3 cp "s3://${R2_BUCKET}/${manifest_key}" existing-release-manifest.json \
              --endpoint-url "${R2_ENDPOINT}" --only-show-errors
            manifest_state="$(node scripts/reconcile-release-manifest.mjs \
              --candidate="${candidate_manifest}" --existing=existing-release-manifest.json \
              --status)"
            case "${manifest_state}" in
              match)
                # `generatedAt` records the first promotion time only. Reuse a semantically
                # identical immutable manifest byte-for-byte on an unchanged retry.
                cp existing-release-manifest.json "artifacts/${RELEASE_TAG}.json"
                echo "Reused the existing immutable manifest for ${RELEASE_TAG}."
                ;;
              replace)
                if [ "${PROMOTION_OPERATION}" != 'replace' ]; then
                  echo "${RELEASE_TAG} is already the stable R2 release and its published assets changed."
                  echo 'Run this workflow with operation=replace to perform a protected same-version replacement.'
                  exit 1
                fi
                mv "${candidate_manifest}" "artifacts/${RELEASE_TAG}.json"
                enable_versioned_replacement 'explicit same-version replacement requested'
                ;;
              *)
                echo "Unexpected manifest reconciliation result: ${manifest_state}"
                exit 1
                ;;
            esac
          elif [ "${current_stable_tag}" = "${RELEASE_TAG}" ]; then
            if [ "${PROMOTION_OPERATION}" != 'replace' ]; then
              echo "${RELEASE_TAG} is the current stable R2 release, but its versioned manifest is missing."
              echo 'Run this workflow with operation=replace to perform a protected repair.'
              exit 1
            fi
            mv "${candidate_manifest}" "artifacts/${RELEASE_TAG}.json"
            enable_versioned_replacement 'explicit repair of a missing live manifest'
          else
            mv "${candidate_manifest}" "artifacts/${RELEASE_TAG}.json"
            echo "No prior R2 copy of ${RELEASE_TAG}; this is the first promotion for the tag."
          fi

      - name: Prepare and verify historical R2 rollback snapshot
        if: env.PROMOTION_OPERATION == 'rollback'
        run: |
          set -euo pipefail
          mkdir -p artifacts github-metadata
          manifest_key="manifests/${RELEASE_TAG}.json"
          aws s3api head-object --bucket "${R2_BUCKET}" --key "${manifest_key}" \
            --endpoint-url "${R2_ENDPOINT}" >/dev/null 2>&1 || {
            echo "R2 does not contain a versioned manifest for ${RELEASE_TAG}; rollback cannot continue."
            exit 1
          }
          aws s3 cp "s3://${R2_BUCKET}/${manifest_key}" "artifacts/${RELEASE_TAG}.json" \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          gh release download "${RELEASE_TAG}" --repo "${GH_REPO}" --dir github-metadata \
            --pattern 'latest*.yml'
          gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json assets > github-release-assets.json
          for name in latest.yml latest-mac.yml latest-linux.yml; do
            aws s3 cp "s3://${R2_BUCKET}/releases/${RELEASE_TAG}/${name}" "artifacts/${name}" \
              --endpoint-url "${R2_ENDPOINT}" --only-show-errors
            cmp --silent "artifacts/${name}" "github-metadata/${name}" || {
              echo "Historical R2 ${name} differs from the published GitHub Release."
              exit 1
            }
          done
          node scripts/prepare-r2-rollback.mjs \
            --tag="${RELEASE_TAG}" --manifest="artifacts/${RELEASE_TAG}.json" \
            --metadata=artifacts --out=stable-update-metadata \
            --fileList=verified-release-files.txt --assetList=verified-rollback-assets.tsv \
            --publicBaseUrl="${R2_PUBLIC_BASE_URL}"
          node -e '
            const fs = require("node:fs")
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
            const release = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
            const github = new Map(release.assets.map((asset) => [asset.name, Number(asset.size)]))
            for (const asset of manifest.assets) {
              if (github.get(asset.filename) !== Number(asset.size)) {
                throw new Error(`GitHub Release asset mismatch: ${asset.filename}`)
              }
            }
          ' "artifacts/${RELEASE_TAG}.json" github-release-assets.json
          while IFS=$'\t' read -r name expected_size; do
            remote_size="$(aws s3api head-object --bucket "${R2_BUCKET}" \
              --key "releases/${RELEASE_TAG}/${name}" --endpoint-url "${R2_ENDPOINT}" \
              --query ContentLength --output text)"
            test "${remote_size}" = "${expected_size}" || {
              echo "Historical R2 asset is missing or incomplete: ${name}"
              exit 1
            }
          done < verified-rollback-assets.tsv
          {
            echo '### Verified rollback snapshot'
            echo
            echo "- Release: \`${RELEASE_TAG}\`"
            echo '- Existing immutable R2 files were reused; historical packages were not rebuilt or overwritten.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prevent stable channel rollback
        run: |
          set -euo pipefail
          for metadata in latest.yml latest-mac.yml latest-linux.yml; do
            if aws s3api head-object \
              --bucket "${R2_BUCKET}" --key "releases/latest/${metadata}" \
              --endpoint-url "${R2_ENDPOINT}" >/dev/null 2>&1; then
              aws s3 cp "s3://${R2_BUCKET}/releases/latest/${metadata}" "current-${metadata}" \
                --endpoint-url "${R2_ENDPOINT}" --only-show-errors
              if [ "${PROMOTION_OPERATION}" = 'promote' ]; then
                node scripts/assert-forward-promotion.mjs \
                  --current="current-${metadata}" --candidate="artifacts/${metadata}"
              else
                echo "Explicit ${PROMOTION_OPERATION}: ${metadata} may replace the current stable pointer"
              fi
            else
              echo "No existing ${metadata}; its first stable promotion is allowed"
            fi
          done

      - name: Upload and verify release files, then switch stable metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          upload_and_verify() {
            local file="$1"
            local key="$2"
            local cache_control="$3"
            local content_type="${4:-}"
            local size
            local sha512
            size="$(stat --format=%s "$file")"
            sha512="$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
            args=(s3 cp "$file" "s3://${R2_BUCKET}/${key}" --endpoint-url "${R2_ENDPOINT}" --cache-control "${cache_control}" --metadata "qzone-sha512=${sha512}" --only-show-errors)
            if [ -n "${content_type}" ]; then
              args+=(--content-type "${content_type}")
            fi
            aws "${args[@]}"
            remote_size="$(aws s3api head-object --bucket "${R2_BUCKET}" --key "${key}" \
              --endpoint-url "${R2_ENDPOINT}" --query ContentLength --output text)"
            remote_sha512="$(aws s3api head-object --bucket "${R2_BUCKET}" --key "${key}" \
              --endpoint-url "${R2_ENDPOINT}" --query 'Metadata."qzone-sha512"' --output text)"
            remote_cache_control="$(aws s3api head-object --bucket "${R2_BUCKET}" --key "${key}" \
              --endpoint-url "${R2_ENDPOINT}" --query CacheControl --output text)"
            normalized_remote_cache_control="$(tr -d '[:space:]' <<<"${remote_cache_control}")"
            normalized_expected_cache_control="$(tr -d '[:space:]' <<<"${cache_control}")"
            test "${remote_size}" = "${size}" && test "${remote_sha512}" = "${sha512}" && \
              test "${normalized_remote_cache_control}" = "${normalized_expected_cache_control}" || {
              echo "R2 object verification failed for ${key}"
              return 1
            }
            if [ -n "${content_type}" ]; then
              remote_content_type="$(aws s3api head-object --bucket "${R2_BUCKET}" --key "${key}" \
                --endpoint-url "${R2_ENDPOINT}" --query ContentType --output text)"
              test "${remote_content_type}" = "${content_type}" || {
                echo "R2 content type verification failed for ${key}"
                return 1
              }
            fi
          }

          upload_immutable_release_object() {
            local file="$1"
            local key="$2"
            local cache_control="$3"
            local content_type="${4:-}"
            local size
            local sha512
            size="$(stat --format=%s "$file")"
            sha512="$(openssl dgst -sha512 -binary "$file" | base64 -w0)"

            if aws s3api head-object --bucket "${R2_BUCKET}" --key "${key}" \
              --endpoint-url "${R2_ENDPOINT}" >/dev/null 2>&1; then
              remote_size="$(aws s3api head-object --bucket "${R2_BUCKET}" --key "${key}" \
                --endpoint-url "${R2_ENDPOINT}" --query ContentLength --output text)"
              remote_sha512="$(aws s3api head-object --bucket "${R2_BUCKET}" --key "${key}" \
                --endpoint-url "${R2_ENDPOINT}" --query 'Metadata."qzone-sha512"' --output text)"
              if [ "${R2_VERSIONED_REPLACEMENT}" = 'true' ]; then
                echo "Replacing explicitly authorized versioned release object: ${key}"
                upload_and_verify "${file}" "${key}" "${cache_control}" "${content_type}"
                return
              fi
              if [ "${remote_size}" = "${size}" ] && { [ "${remote_sha512}" = 'None' ] || [ -z "${remote_sha512}" ]; }; then
                # 兼容旧流程上传、没有 qzone-sha512 元数据的历史对象：只在下载后
                # 确认字节完全相同的前提下，用同一文件补齐元数据与缓存策略。
                legacy_file="$(mktemp)"
                aws s3 cp "s3://${R2_BUCKET}/${key}" "${legacy_file}" \
                  --endpoint-url "${R2_ENDPOINT}" --only-show-errors
                legacy_sha512="$(openssl dgst -sha512 -binary "${legacy_file}" | base64 -w0)"
                rm -f "${legacy_file}"
                test "${legacy_sha512}" = "${sha512}" || {
                  echo "Refusing to replace published release object with different bytes: ${key}"
                  return 1
                }
                echo "Verified legacy immutable object bytes; repairing its metadata: ${key}"
                upload_and_verify "${file}" "${key}" "${cache_control}" "${content_type}"
                return
              fi
              test "${remote_size}" = "${size}" && test "${remote_sha512}" = "${sha512}" || {
                echo "Refusing to replace published release object with different bytes: ${key}"
                echo "Published versions are immutable for auto-update safety. Create a new patch version instead."
                return 1
              }
              echo "Verified existing immutable object: ${key}"
              return
            fi

            upload_and_verify "${file}" "${key}" "${cache_control}" "${content_type}"
          }

          backup_stable_object() {
            local key="$1"
            local backup="$2"
            if aws s3api head-object --bucket "${R2_BUCKET}" --key "${key}" \
              --endpoint-url "${R2_ENDPOINT}" >/dev/null 2>&1; then
              aws s3 cp "s3://${R2_BUCKET}/${key}" "${backup}" \
                --endpoint-url "${R2_ENDPOINT}" --only-show-errors
            else
              : > "${backup}.absent"
            fi
          }

          backup_versioned_object() {
            local key="$1"
            local backup="$2"
            mkdir -p "$(dirname "${backup}")"
            if aws s3api head-object --bucket "${R2_BUCKET}" --key "${key}" \
              --endpoint-url "${R2_ENDPOINT}" >/dev/null 2>&1; then
              aws s3 cp "s3://${R2_BUCKET}/${key}" "${backup}" \
                --endpoint-url "${R2_ENDPOINT}" --only-show-errors
            else
              : > "${backup}.absent"
            fi
          }

          restore_versioned_object() {
            local key="$1"
            local backup="$2"
            local content_type="${3:-}"
            if [ -f "${backup}" ]; then
              upload_and_verify "${backup}" "${key}" \
                'public, max-age=31536000, immutable' "${content_type}"
            elif [ -f "${backup}.absent" ]; then
              aws s3api delete-object --bucket "${R2_BUCKET}" --key "${key}" \
                --endpoint-url "${R2_ENDPOINT}" >/dev/null
            fi
          }

          resolve_cloudflare_zone() {
            test -n "${CLOUDFLARE_API_TOKEN:-}" || {
              echo 'Same-version replacement requires the CLOUDFLARE_API_TOKEN secret for CDN cache purge.'
              return 1
            }
            if [ -n "${CLOUDFLARE_ZONE_ID:-}" ]; then
              [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-f0-9]{32}$ ]] || {
                echo 'CLOUDFLARE_ZONE_ID must be a 32-character Cloudflare zone identifier.'
                return 1
              }
              return
            fi
            local zones_response
            zones_response="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              'https://api.cloudflare.com/client/v4/zones?status=active&per_page=50')"
            CLOUDFLARE_ZONE_ID="$(node -e '
              const payload = JSON.parse(process.argv[1])
              const host = new URL(process.argv[2]).hostname
              if (!payload.success) throw new Error("Cloudflare zone lookup failed")
              const matches = payload.result.filter((zone) => host === zone.name || host.endsWith(`.${zone.name}`))
              matches.sort((left, right) => right.name.length - left.name.length)
              if (!matches[0]?.id) throw new Error(`No Cloudflare zone contains ${host}`)
              process.stdout.write(matches[0].id)
            ' "${zones_response}" "${R2_PUBLIC_BASE_URL}")"
            export CLOUDFLARE_ZONE_ID
          }

          purge_versioned_cache() {
            local response
            response="$(curl --fail --silent --show-error \
              --request POST \
              --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data @cache-purge-payload.json)"
            node -e '
              const payload = JSON.parse(process.argv[1])
              if (!payload.success) {
                throw new Error(`Cloudflare cache purge failed: ${JSON.stringify(payload.errors || [])}`)
              }
            ' "${response}"
          }

          stable_switched=false
          stable_committed=false
          versioned_replacement_started=false
          versioned_replacement_committed=false
          restore_promotion() {
            local failed_status="$1"
            trap - ERR
            set +e
            if [ "${versioned_replacement_started}" = 'true' ] && \
              [ "${versioned_replacement_committed}" != 'true' ]; then
              echo 'Versioned replacement failed; restoring the previous R2 release objects.'
              while IFS= read -r name; do
                case "${name}" in
                  latest*.yml)
                    restore_versioned_object "releases/${RELEASE_TAG}/${name}" \
                      "versioned-backup/releases/${name}" 'application/x-yaml'
                    ;;
                  *)
                    restore_versioned_object "releases/${RELEASE_TAG}/${name}" \
                      "versioned-backup/releases/${name}"
                    ;;
                esac
              done < verified-release-files.txt
              restore_versioned_object "manifests/${RELEASE_TAG}.json" \
                versioned-backup/manifest.json 'application/json'
              if [ "${CACHE_PURGE_MODE}" = 'automatic' ]; then
                purge_versioned_cache || echo 'Warning: restored R2 objects but CDN purge retry failed.'
              fi
            fi
            if [ "${stable_switched}" = 'true' ] && [ "${stable_committed}" != 'true' ]; then
              echo 'Stable channel verification failed; restoring the previous public pointers.'
              for name in latest.yml latest-mac.yml latest-linux.yml; do
                key="releases/latest/${name}"
                if [ -f "stable-backup/${name}" ]; then
                  aws s3 cp "stable-backup/${name}" "s3://${R2_BUCKET}/${key}" \
                    --endpoint-url "${R2_ENDPOINT}" --cache-control 'no-cache, no-store, max-age=0' \
                    --content-type 'application/x-yaml' --only-show-errors
                else
                  aws s3api delete-object --bucket "${R2_BUCKET}" --key "${key}" \
                    --endpoint-url "${R2_ENDPOINT}" >/dev/null
                fi
              done
              if [ -f stable-backup/latest.json ]; then
                aws s3 cp stable-backup/latest.json "s3://${R2_BUCKET}/manifests/latest.json" \
                  --endpoint-url "${R2_ENDPOINT}" --cache-control 'no-cache, no-store, max-age=0' \
                  --content-type 'application/json' --only-show-errors
              else
                aws s3api delete-object --bucket "${R2_BUCKET}" --key 'manifests/latest.json' \
                  --endpoint-url "${R2_ENDPOINT}" >/dev/null
              fi
            fi
            exit "${failed_status}"
          }
          trap 'restore_promotion $?' ERR

          release_prefix="releases/${RELEASE_TAG}"
          if [ "${PROMOTION_OPERATION}" != 'rollback' ]; then
            if [ "${PROMOTION_OPERATION}" = 'replace' ] && \
              [ "${R2_VERSIONED_REPLACEMENT}" = 'true' ]; then
              node -e '
                const fs = require("node:fs")
                const base = process.argv[1].replace(/\/$/, "")
                const tag = process.argv[2]
                const names = fs.readFileSync(process.argv[3], "utf8").trim().split(/\r?\n/).filter(Boolean)
                const files = names.map((name) => `${base}/releases/${tag}/${encodeURIComponent(name)}`)
                files.push(`${base}/manifests/${tag}.json`)
                fs.writeFileSync("cache-purge-payload.json", JSON.stringify({ files }))
              ' "${R2_PUBLIC_BASE_URL}" "${RELEASE_TAG}" verified-release-files.txt
              if [ "${CACHE_PURGE_MODE}" = 'automatic' ]; then
                resolve_cloudflare_zone
                # This harmless preflight purge proves the token has Cache Purge permission
                # before any live versioned object is changed.
                purge_versioned_cache
              else
                echo 'Manual cache purge selected; the operator must purge the listed versioned URLs after this workflow succeeds.'
              fi
              mkdir -p versioned-backup/releases
              while IFS= read -r name; do
                backup_versioned_object "${release_prefix}/${name}" \
                  "versioned-backup/releases/${name}"
              done < verified-release-files.txt
              backup_versioned_object "manifests/${RELEASE_TAG}.json" versioned-backup/manifest.json
              versioned_replacement_started=true
            fi

            while IFS= read -r name; do
              case "${name}" in
                latest*.yml)
                  upload_immutable_release_object "artifacts/${name}" "${release_prefix}/${name}" \
                    "public, max-age=31536000, immutable" "application/x-yaml"
                  ;;
                *)
                  upload_immutable_release_object "verified-assets/${name}" "${release_prefix}/${name}" \
                    "public, max-age=31536000, immutable"
                  ;;
              esac
            done < verified-release-files.txt
            # The versioned manifest is an inspectable snapshot, not an updater pointer.
            upload_immutable_release_object "artifacts/${RELEASE_TAG}.json" "manifests/${RELEASE_TAG}.json" \
              "public, max-age=31536000, immutable" "application/json"
            if [ "${versioned_replacement_started}" = 'true' ] && \
              [ "${CACHE_PURGE_MODE}" = 'automatic' ]; then
              purge_versioned_cache
            fi
          else
            echo "Rollback reuses the verified immutable ${RELEASE_TAG} snapshot; no versioned object is uploaded."
          fi

          mkdir stable-backup
          for name in latest.yml latest-mac.yml latest-linux.yml; do
            backup_stable_object "releases/latest/${name}" "stable-backup/${name}"
          done
          backup_stable_object 'manifests/latest.json' 'stable-backup/latest.json'

          echo 'Versioned release files are verified. Switching stable updater pointers.'
          stable_switched=true
          for name in latest.yml latest-mac.yml latest-linux.yml; do
            upload_and_verify "stable-update-metadata/${name}" "releases/latest/${name}" \
              "no-cache, no-store, max-age=0" "application/x-yaml"
          done
          # The website follows this pointer. Write it only after all three client
          # updater pointers have been verified, so the website never advertises a
          # release whose update metadata is not ready.
          upload_and_verify "artifacts/${RELEASE_TAG}.json" "manifests/latest.json" \
            "no-cache, no-store, max-age=0" "application/json"
          node scripts/audit-r2-release.mjs \
            --tag="${RELEASE_TAG}" --publicBaseUrl="${R2_PUBLIC_BASE_URL}" --githubRepo="${GH_REPO}"
          stable_committed=true
          versioned_replacement_committed=true
          trap - ERR
          {
            echo '### R2 promotion complete'
            echo
            echo "- Release: \`${RELEASE_TAG}\`"
            echo "- Operation: \`${PROMOTION_OPERATION}\`"
            echo "- Cache purge: \`${CACHE_PURGE_MODE}\`"
            echo '- Normal releases remain immutable; rollback reuses a verified historical snapshot.'
            echo '- Explicit same-version replacement backs up every target object and purges affected CDN URLs.'
            echo '- All three updater pointers were switched before the website manifest, then the public domain was audited.'
            echo '- If verification fails, previous stable pointers and any overwritten versioned objects are restored automatically.'
            if [ "${PROMOTION_OPERATION}" = 'replace' ] && \
              [ "${CACHE_PURGE_MODE}" = 'manual' ]; then
              echo '- Action required: purge the URLs in `cache-purge-payload.json` from Cloudflare before announcing completion.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
