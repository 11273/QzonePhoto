name: Audit or clean R2 release layout

on:
  workflow_dispatch:
    inputs:
      prune_tag:
        description: 要删除的失败版本目录，例如 v2.7.0（留空只清理 latest 旧副本）
        required: false
        default: ''
        type: string
      apply:
        description: 确认执行删除（默认仅生成审计与清理计划）
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: maintain-r2
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      GH_REPO: 11273/QzonePhoto
      PRUNE_TAG: ${{ inputs.prune_tag }}
      APPLY: ${{ inputs.apply }}
    steps:
      - name: Validate R2 maintenance configuration
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo 'Missing secret: R2_ACCESS_KEY_ID'; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY:-}" || { echo 'Missing secret: R2_SECRET_ACCESS_KEY'; exit 1; }
          test -n "${R2_BUCKET:-}" || { echo 'Missing repository variable: R2_BUCKET'; exit 1; }
          test -n "${R2_ENDPOINT:-}" || { echo 'Missing repository variable: R2_ENDPOINT'; exit 1; }
          test "${R2_PUBLIC_BASE_URL:-}" = 'https://dl.qzonephoto.getgit.one' || {
            echo 'R2_PUBLIC_BASE_URL must be https://dl.qzonephoto.getgit.one'
            exit 1
          }

      - name: Check out maintenance scripts
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify R2 maintenance logic
        run: pnpm test:release

      - name: Inspect stable release and R2 layout
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "s3://${R2_BUCKET}/manifests/latest.json" current-manifest.json \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          active_tag="$(node -e "const value=require('./current-manifest.json'); process.stdout.write(value.tag || '')")"
          test -n "${active_tag}" || { echo 'Stable R2 manifest has no tag'; exit 1; }
          aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --endpoint-url "${R2_ENDPOINT}" \
            --output json > r2-objects.json
          node scripts/audit-r2-layout.mjs --objects=r2-objects.json \
            --activeTag="${active_tag}" --pruneTag="${PRUNE_TAG}" --out=r2-cleanup-plan.json
          node scripts/audit-r2-release.mjs --tag="${active_tag}" \
            --publicBaseUrl="${R2_PUBLIC_BASE_URL}" --githubRepo="${GH_REPO}"
          {
            echo '### R2 layout audit'
            echo
            echo "- Current stable release: \`${active_tag}\`"
            echo "- Delete mode: \`${APPLY}\`"
            echo "- Requested failed version cleanup: \`${PRUNE_TAG:-none}\`"
            echo
            echo '```json'
            cat r2-cleanup-plan.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Delete only the approved cleanup plan
        if: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t keys < <(node -e "const plan=require('./r2-cleanup-plan.json'); for (const item of plan.deleteCandidates) console.log(item.key)")
          if [ "${#keys[@]}" -eq 0 ]; then
            echo 'R2 is already organized; no objects need deletion.'
            exit 0
          fi
          printf 'Deleting %s approved obsolete R2 objects:\n' "${#keys[@]}"
          printf '%s\n' "${keys[@]}"
          for key in "${keys[@]}"; do
            aws s3api delete-object --bucket "${R2_BUCKET}" --key "${key}" \
              --endpoint-url "${R2_ENDPOINT}" >/dev/null
          done
          aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --endpoint-url "${R2_ENDPOINT}" \
            --output json > r2-objects-after-cleanup.json
          node scripts/audit-r2-layout.mjs --objects=r2-objects-after-cleanup.json \
            --activeTag="$(node -e "const value=require('./current-manifest.json'); process.stdout.write(value.tag || '')")" \
            --pruneTag="${PRUNE_TAG}" --out=r2-cleanup-after.json
          node -e "const plan=require('./r2-cleanup-after.json'); if (plan.deleteCandidates.length) { console.error('Approved obsolete objects remain after cleanup'); process.exit(1) }"
          node scripts/audit-r2-release.mjs --publicBaseUrl="${R2_PUBLIC_BASE_URL}" --githubRepo="${GH_REPO}"
