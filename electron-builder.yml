# 应用唯一标识符 (采用反向域名格式)
appId: com.qzonephoto.app

# 产品名称（桌面图标和安装后的应用名称；保持简短，避免系统快捷方式换行）
productName: 企鹅相册

# 构建资源配置
directories:
  buildResources: build # 指定构建资源目录（图标等）

# 应用运行时白名单。package.json 与 production 依赖由 electron-builder 自动加入；
# 官网、发布脚本、测试、日志和本地截图不得进入桌面端安装包。
files:
  - out/**

# 随安装包提供 GPL-3.0 正文，避免它仅存在于源码仓库中
extraResources:
  - from: LICENSE
    to: LICENSE

# ASAR解压配置（指定不需要压缩的文件）
asarUnpack:
  - out/preload/** # 保持preload脚本未压缩，确保IPC通信正常
  - node_modules/ffmpeg-static/** # 视频元数据写入工具必须在 ASAR 外执行

# 签名后钩子（用于苹果公证等操作，脚本内部会检查平台）
afterSign: build/afterSign.js

# 打包后钩子（自定义处理打包文件）
afterPack: build/afterPack.js

# Windows平台配置
win:
  icon: build/icons/icon.ico
  executableName: QzonePhoto # 生成的可执行文件名称，不支持环境变量
  target:
    - target: nsis
nsis:
  artifactName: QzonePhoto-${version}-${os}-${arch}-setup.${ext} # 安装包命名格式
  shortcutName: ${productName} # 快捷方式名称
  uninstallDisplayName: ${productName} # 卸载程序显示名称
  createDesktopShortcut: always # 始终创建桌面快捷方式
  oneClick: false # 禁用一键安装
  allowElevation: true # 允许权限提升
  allowToChangeInstallationDirectory: true # 允许修改安装目录
  runAfterFinish: true # 安装完成后自动运行
  perMachine: false # false = 当前用户安装，true = 所有用户
  deleteAppDataOnUninstall: false # 卸载时不删除用户数据

# Linux平台配置
linux:
  icon: build/icons
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: github.com/11273
  category: Utility
  synopsis: 企鹅相册 · QzonePhoto
  description: 一个简单易用的 QQ 空间相册本地管理与备份工具

# macOS平台配置
mac:
  icon: build/icons/icon.icns
  # 添加类别
  category: public.app-category.utilities
  # 权限配置文件
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
  # 签名配置
  # 无 Apple Developer 证书时 electron-builder 会完全跳过签名；由 build/afterPack.js
  # 里统一做递归 ad-hoc 重签，避免 macOS 14+ 因 Team ID 不一致导致启动崩溃。
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  artifactName: QzonePhoto-${version}-${os}-${arch}.${ext}
  target:
    - target: zip
    - target: dmg

# macOS DMG配置
dmg:
  artifactName: QzonePhoto-${version}-${os}-${arch}.${ext} # DMG包命名格式
  format: UDZO
  # GitHub macos-14 的 dmgbuild 偶发在 hdiutil 自动收缩阶段失败；保留已创建的镜像，
  # 不影响 DMG 挂载、安装或更新包校验，并避免因构建机工具链波动中断整次发布。
  shrink: false

# AppImage配置
appImage:
  artifactName: QzonePhoto-${version}-${os}-${arch}.${ext} # 命名格式
  synopsis: 企鹅相册 · QzonePhoto
  category: Utility

# DEB包配置
deb:
  artifactName: QzonePhoto-${version}-linux-${arch}.${ext}
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  category: utils
  priority: optional

releaseInfo:
  releaseNotesFile: RELEASE_NOTES.md

# 禁止自动重建原生模块
npmRebuild: false
